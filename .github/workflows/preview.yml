# Pull request previews on Cloudflare Pages.
# Production stays on GitHub Pages via .github/workflows/deploy.yml.
name: preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Cloudflare Pages preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check preview helpers
        run: node scripts/pages-preview.mjs self-test

      - name: Check built asset URLs
        run: node scripts/pages-preview.mjs check-assets dist

      - name: Sanitize branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          name="$(node scripts/pages-preview.mjs branch "$HEAD_REF" "$PR_NUMBER")"
          case "$name" in
            ""|main|master|production|-*|*-)
              echo "Refusing unsafe Pages branch alias" >&2
              exit 1
              ;;
          esac
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare secrets
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Preview is not configured. Skipping Cloudflare Pages deploy."
          fi

      - name: Ensure Pages project
        id: project
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/pages-preview.mjs ensure-project
          name="$(node scripts/pages-preview.mjs project-name)"
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"

      - name: Prepare Wrangler directory
        if: steps.cloudflare.outputs.configured == 'true'
        run: mkdir -p /tmp/cf-pages-wrangler

      - name: Deploy preview
        id: deploy
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4"
          workingDirectory: /tmp/cf-pages-wrangler
          command: pages deploy "${{ github.workspace }}/dist" --project-name=${{ steps.project.outputs.name }} --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.sha }}

      - name: Comment on pull request
        if: ${{ !cancelled() && steps.cloudflare.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          PREVIEW_CONFIGURED: ${{ steps.cloudflare.outputs.configured }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs['pages-deployment-alias-url'] }}
          PREVIEW_DEPLOYMENT_URL: ${{ steps.deploy.outputs['deployment-url'] }}
          PREVIEW_ENVIRONMENT: ${{ steps.deploy.outputs['pages-environment'] }}
          PREVIEW_LOG: ${{ steps.deploy.outputs['command-output'] }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          script: |
            const marker = "<!-- cf-pages-preview -->";
            const configured = process.env.PREVIEW_CONFIGURED === "true";
            const deployOutcome = process.env.DEPLOY_OUTCOME || "skipped";
            const runUrl = process.env.RUN_URL;
            const isFork = process.env.IS_FORK === "true";

            function pagesUrl(value) {
              if (!value) return "";
              let url;
              try {
                url = new URL(String(value).trim());
              } catch {
                return "";
              }
              const host = url.hostname;
              // The apex host is the Pages production deployment. Previews use a branch subdomain.
              if (url.protocol !== "https:" || !host.endsWith(".resume-preview.pages.dev")) {
                return "";
              }
              if (url.username || url.password || url.search || url.hash) return "";
              return url.origin;
            }

            function fromLog(label) {
              const log = process.env.PREVIEW_LOG || "";
              const match = log.match(new RegExp(label + "\\s*(https://\\S+)", "i"));
              return pagesUrl(match?.[1] || "");
            }

            const alias =
              pagesUrl(process.env.PREVIEW_ALIAS_URL) ||
              fromLog("Deployment alias URL:");
            const deployment =
              pagesUrl(process.env.PREVIEW_DEPLOYMENT_URL) ||
              fromLog("Take a peek over at");
            const previewUrl = alias || deployment;
            const environment = (process.env.PREVIEW_ENVIRONMENT || "").toLowerCase();
            const sha = /^[0-9a-f]{40}$/.test(process.env.HEAD_SHA || "")
              ? process.env.HEAD_SHA
              : "";

            let failure = "";
            let body;
            if (!configured) {
              body = [
                marker,
                "## Cloudflare Pages preview",
                "",
                "Preview is not configured.",
                "",
                "`CLOUDFLARE_API_TOKEN` または `CLOUDFLARE_ACCOUNT_ID` が無いため、プレビューはデプロイしていません。フォーク、またはリポジトリの Actions シークレットが未設定のときです。",
                "",
                `Workflow: ${runUrl}`,
              ].join("\n");
            } else if (deployOutcome !== "success" || environment === "production" || !previewUrl) {
              failure =
                environment === "production"
                  ? "Preview deploy published the production environment."
                  : "Preview deploy failed.";
              body = [
                marker,
                "## Cloudflare Pages preview",
                "",
                failure,
                "ログを確認してください。",
                "",
                `Workflow: ${runUrl}`,
              ].join("\n");
            } else {
              const lines = [
                marker,
                "## Cloudflare Pages preview",
                "",
                `**Preview:** ${previewUrl}`,
              ];
              if (deployment && deployment !== previewUrl) {
                lines.push(`**Deployment:** ${deployment}`);
              }
              if (sha) lines.push(`**Commit:** \`${sha}\``);
              lines.push(
                "",
                "この URL は同じプルリクエストへの次の push で更新されます。",
                "",
                `Workflow: ${runUrl}`,
              );
              body = lines.join("\n");
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            async function findSticky() {
              for (let page = 1; ; page += 1) {
                const { data } = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number,
                  per_page: 100,
                  page,
                });
                const found = data.find(
                  (comment) =>
                    comment.user?.login === "github-actions[bot]" &&
                    typeof comment.body === "string" &&
                    comment.body.includes(marker),
                );
                if (found) return found;
                if (data.length < 100) return null;
              }
            }

            try {
              const existing = await findSticky();
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              const status = error?.status;
              if (isFork && (status === 403 || status === 401)) {
                core.warning(
                  "Could not comment on this fork pull request. Preview is not configured for forks.",
                );
                return;
              }
              throw error;
            }

            if (failure) {
              core.setFailed(failure);
            }
